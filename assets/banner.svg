<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" height="360" style="background:#090d16; border-radius:12px; font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif; overflow:hidden;">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#090d16" />
      <stop offset="100%" stop-color="#030712" />
    </linearGradient>

    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="rgba(255,255,255,0.07)" />
      <stop offset="100%" stop-color="rgba(255,255,255,0.02)" />
    </linearGradient>

    <!-- Grid Pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(255,255,255,0.03)" stroke-width="1" />
    </pattern>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="30" result="blur" />
    </filter>
  </defs>

  <style>
    @keyframes pulseOrb {
      0%, 100% { transform: scale(1) translate(0, 0); opacity: 0.35; }
      50% { transform: scale(1.15) translate(20px, -15px); opacity: 0.55; }
    }
    @keyframes floatPill1 {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-8px); }
    }
    @keyframes floatPill2 {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(8px); }
    }
    @keyframes shimmerBar {
      0% { transform: translateX(-100%); }
      100% { transform: translateX(200%); }
    }
    .orb-1 { animation: pulseOrb 8s ease-in-out infinite alternate; transform-origin: center; }
    .orb-2 { animation: pulseOrb 10s ease-in-out infinite alternate-reverse; transform-origin: center; }
    .floating-card-1 { animation: floatPill1 5s ease-in-out infinite; }
    .floating-card-2 { animation: floatPill2 6s ease-in-out infinite; }
  </style>

  <!-- Deep Background -->
  <rect width="1200" height="360" fill="url(#bgGlow)" />
  <rect width="1200" height="360" fill="url(#grid)" />

  <!-- Dynamic Glowing Orbs in Background -->
  <circle class="orb-1" cx="200" cy="100" r="140" fill="#38bdf8" filter="url(#glow)" opacity="0.3" />
  <circle class="orb-2" cx="1020" cy="240" r="160" fill="#818cf8" filter="url(#glow)" opacity="0.25" />
  <circle class="orb-1" cx="600" cy="300" r="120" fill="#c084fc" filter="url(#glow)" opacity="0.2" />

  <!-- Animated Ambient Tech Graphic Elements in Background -->
  <g opacity="0.45" class="floating-card-1">
    <rect x="860" y="55" width="280" height="90" rx="14" fill="url(#cardGrad)" stroke="rgba(255,255,255,0.12)" />
    <circle cx="890" cy="85" r="12" fill="#38bdf8" opacity="0.8" />
    <rect x="915" y="78" width="90" height="7" rx="3.5" fill="rgba(255,255,255,0.7)" />
    <rect x="915" y="92" width="130" height="6" rx="3" fill="rgba(255,255,255,0.3)" />
    <rect x="890" y="116" width="220" height="12" rx="4" fill="rgba(56,189,248,0.15)" />
  </g>

  <g opacity="0.4" class="floating-card-2">
    <rect x="890" y="185" width="260" height="110" rx="14" fill="url(#cardGrad)" stroke="rgba(255,255,255,0.1)" />
    <path d="M915 260 Q 950 220 985 245 T 1055 210 T 1120 230" fill="none" stroke="#818cf8" stroke-width="2.5" stroke-linecap="round" />
    <circle cx="1055" cy="210" r="4" fill="#c084fc" />
    <rect x="915" y="205" width="80" height="8" rx="4" fill="rgba(255,255,255,0.6)" />
    <rect x="1090" y="205" width="35" height="16" rx="8" fill="rgba(129,140,248,0.25)" />
  </g>

  <!-- Foreground Content: Header & Titles -->
  <g transform="translate(80, 0)">
    <!-- Top Tech Badge -->
    <g transform="translate(0, 60)">
      <rect width="265" height="32" rx="16" fill="rgba(56,189,248,0.12)" stroke="rgba(56,189,248,0.35)" />
      <circle cx="18" cy="16" r="4" fill="#38bdf8" />
      <text x="32" y="21" fill="#7dd3fc" font-size="12.5" font-weight="600" letter-spacing="1">CURATED STOREFRONT STACK</text>
    </g>

    <!-- Main Title -->
    <text x="0" y="145" fill="url(#primaryGrad)" font-size="44" font-weight="800" letter-spacing="-0.5">
      Awesome Storefront Templates
    </text>

    <!-- Subtitle -->
    <text x="0" y="185" fill="#f1f5f9" font-size="20" font-weight="500">
      Production-Ready Headless Commerce, Theme Frameworks &amp; SaaS Starters
    </text>

    <text x="0" y="218" fill="#94a3b8" font-size="14.5" font-weight="400">
      Accelerate your merchant experience across Shopify Hydrogen, WooCommerce, Medusa, Next.js &amp; Saleor
    </text>

    <!-- Feature Pills in Foreground -->
    <g transform="translate(0, 252)">
      <!-- Pill 1 -->
      <g>
        <rect width="135" height="34" rx="17" fill="rgba(255,255,255,0.06)" stroke="rgba(255,255,255,0.15)" />
        <text x="18" y="22" fill="#e2e8f0" font-size="13" font-weight="600">⚡ Headless First</text>
      </g>
      <!-- Pill 2 -->
      <g transform="translate(150, 0)">
        <rect width="165" height="34" rx="17" fill="rgba(255,255,255,0.06)" stroke="rgba(255,255,255,0.15)" />
        <text x="18" y="22" fill="#e2e8f0" font-size="13" font-weight="600">🛍️ Shopify OS 2.0</text>
      </g>
      <!-- Pill 3 -->
      <g transform="translate(330, 0)">
        <rect width="155" height="34" rx="17" fill="rgba(255,255,255,0.06)" stroke="rgba(255,255,255,0.15)" />
        <text x="18" y="22" fill="#e2e8f0" font-size="13" font-weight="600">📦 Medusa 2.0 / Woo</text>
      </g>
      <!-- Pill 4 -->
      <g transform="translate(500, 0)">
        <rect width="145" height="34" rx="17" fill="rgba(255,255,255,0.06)" stroke="rgba(255,255,255,0.15)" />
        <text x="18" y="22" fill="#e2e8f0" font-size="13" font-weight="600">⭐ 100% Curated</text>
      </g>
    </g>
  </g>

  <!-- Sleek Bottom Glow Line -->
  <rect x="0" y="357" width="1200" height="3" fill="url(#primaryGrad)" />
</svg>
